# Read the Docs build configuration: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

# The docs import only codesign_gym and core (src/ is put on sys.path in conf.py), so the heavy
# simulator dependencies are not installed here; autodoc mocks them.
python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
