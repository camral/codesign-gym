# Host-side checks for the integrated soft-robot package. Run from this repo root.
# Optional JAX/Warp/Newton implementations are checked through annotated host
# contracts; installing graphics/CUDA packages is not required for this check.
[mypy]
python_version = 3.11
platform = linux
files = src/envs/soft_walker
exclude = (?x)( /(?:third_party|runs|handoff|__pycache__)/ | /warp_native/(?:adaptive_gmres|adaptive_krylov|callback_kernels|episode_kernels|iteration|kernels|linearization|local|scan|solid_episode_kernels|solid_kernels|solid_tangents|spring_kvaerno_kernels|work)\.py$ )
namespace_packages = True
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR/src
follow_imports = skip
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True
show_error_codes = True
pretty = False

# Warp kernel-factory bodies use runtime wp.float/wp.vec/wp.array annotations.
# They retain those annotations and are exercised by numerical CUDA tests.
# Ordinary host interfaces in those files are still annotated and inventoried.
# Imported engine modules are separately listed in `files`, so each first-party
# host body is checked; optional third-party internals are outside this scope.
